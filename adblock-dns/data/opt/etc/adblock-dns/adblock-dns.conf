# adblock-dns configuration
# After editing run: /opt/etc/init.d/S56adblock-dns restart

# Upstream DNS servers (space separated). Default: Google DNS.
UPSTREAM_DNS="8.8.8.8 8.8.4.4"

# Port to listen on. 553 keeps the built-in Keenetic DNS proxy in charge
# of port 53; register this server in the router CLI (port after "#",
# needs firmware 2.14+):
#   no ip name-server
#   ip name-server 127.0.0.1:553
#   system configuration save
# Using 53 instead requires disabling the built-in proxy ("opkg dns-override"
# in the router CLI) and leaves the LAN without DNS if this service is down.
LISTEN_PORT="553"

# Listen address. 127.0.0.1 = router only, not reachable from LAN or WAN.
# Set to the router LAN IP (e.g. 192.168.1.1) to serve LAN clients directly.
# Empty = all interfaces (do not combine with a public WAN address).
LISTEN_ADDR="127.0.0.1,192.168.1.1"

# Enable/disable ad blocking (yes/no). "no" = plain forwarding DNS.
BLOCKING_ENABLED="yes"

# Blocklist URLs (space separated). hosts-file or plain-domain format.
BLOCKLIST_URLS="https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"

# Blocked domains, one per line (blocks subdomains too). Read on every
# service start/restart.
BLACKLIST_FILE="/opt/etc/adblock-dns/blacklist.txt"

# Excluded domains, one per line. Applied to both BLACKLIST_FILE and
# downloaded blocklists; a whitelisted domain resolves via upstream even
# if its parent zone is blacklisted. Read on every service start/restart.
WHITELIST_FILE="/opt/etc/adblock-dns/whitelist.txt"

# dnsmasq cache size (entries).
CACHE_SIZE="1500"

# Log file. Empty = syslog only (goes to the Keenetic system log).
LOG_FILE="/opt/var/log/adblock-dns.log"

# Log every DNS query (yes/no). Shows both incoming queries and which of them
# the lists block. Verbose: expect a few MB per hour on a busy network.
LOG_QUERIES="yes"

# Rotate LOG_FILE once it grows past this size, KB. 0 = never rotate.
# Checked on service start and on every adblock-dns-update run. For a hard
# cap between those, add to /opt/etc/crontab:
#   0 * * * * root /opt/bin/adblock-dns-update logrotate
LOG_MAX_KB="512"

# How many rotated files to keep (adblock-dns.log.1, .2, ...). 0 = truncate
# in place without keeping a copy.
LOG_KEEP="1"
